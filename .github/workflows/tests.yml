name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies (no trained model)
        run: python -m pip install Flask requests Pillow numpy aiohttp
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check static/app.js
